<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>写真復元の比較 | てもとフォト</title>
<link rel="stylesheet" href="restoration-check.css">
<script type="module" src="restoration-check.js"></script>
</head>
<body>
<main>
<a href="index.html">てもとフォトへ戻る</a>
<h1>写真復元の比較（試作）</h1>
<p>写真全体を明るくし、ノイズを減らす処理を原寸で比較します。写真は端末の外に送りません。1600万画素・幅16384pxまでのJPEG・PNG・WebPに対応。自動縮小はしません。</p>
<label>元の写真 <input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
<div class="controls">
<label>全体の明るさ <input id="amount" type="range" min="0" max="100" value="60"><output id="amount-value">60</output></label>
<label>ノイズ量 <input id="noise" type="range" min="0" max="30" value="3"><output id="noise-value">3</output></label>
<p>ノイズ量は少なめから調整してください。強すぎると肌・髪・レースの細部が消えることがあります。手ぶれの復元は含みません。</p>
<button id="run" disabled>補正して比較</button>
<button id="cancel" disabled>中止</button>
<button id="save" disabled>補正画像をPNGで保存</button>
<label><input id="actual" type="checkbox" checked>原寸で確認（外すと全体を表示）</label>
</div>
<progress id="progress" max="100" value="0" aria-label="補正の進捗"></progress>
<p id="status" role="status">元の写真を選んでください。</p>
<div id="comparison" class="comparison actual">
<section><h2>補正前</h2><div class="viewport"><canvas id="before"></canvas></div></section>
<section><h2>補正後</h2><div class="viewport"><canvas id="after"></canvas></div></section>
</div>
</main>
</body>
</html>
