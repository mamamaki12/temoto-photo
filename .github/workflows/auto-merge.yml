name: Auto-merge
# PR のテスト（CI）が通ったら、その PR を main に自動でマージし、公開版（GitHub Pages）も更新する。
# - 下書き（Draft）の PR と、ほかのリポジトリ（フォーク）からの PR はマージしない
# - テストしたコミットが PR の最新のときだけマージする（テスト後に新しいコミットが来たら、そのテストを待つ）
# - 自動でマージしたくない PR には「no-auto-merge」ラベルを付ける
# GITHUB_TOKEN でのマージでは main への push のワークフローが動かないので、公開は workflow_dispatch で起動する。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: auto-merge
  cancel-in-progress: false
jobs:
  merge:
    # CI は同じコミットで push と pull_request の 2 回動く。どちらが後に終わっても、全部通っていればマージする
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${run.head_branch}` });
            const pr = prs.find((p) => p.head.sha === run.head_sha);
            if (!pr) { core.info(`テストしたコミット ${run.head_sha} が最新の PR はありません（新しいコミットのテストを待ちます）`); return; }
            if (pr.draft) { core.info(`#${pr.number} は下書きなのでマージしません`); return; }
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) { core.info(`#${pr.number} はフォークからなのでマージしません`); return; }
            if (pr.labels.some((l) => l.name === 'no-auto-merge')) { core.info(`#${pr.number} は no-auto-merge なのでマージしません`); return; }
            if (pr.base.ref !== 'main') { core.info(`#${pr.number} は main 向けではないのでマージしません`); return; }
            // ほかのテスト（同じコミットの全部のチェック）も通っているか
            const { data: checks } = await github.rest.checks.listForRef({ owner, repo, ref: run.head_sha, per_page: 100 });
            const others = checks.check_runs.filter((c) => c.name !== 'merge');
            const bad = others.filter((c) => c.status !== 'completed' || !['success', 'skipped', 'neutral'].includes(c.conclusion));
            if (bad.length) { core.info(`まだ終わっていない・失敗したチェックがあります: ${bad.map((c) => `${c.name}=${c.conclusion ?? c.status}`).join(', ')}`); return; }
            await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, sha: run.head_sha, merge_method: 'merge' });
            core.info(`#${pr.number} をマージしました`);
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'pages.yml', ref: 'main' });
            core.info('公開版の更新を始めました');
