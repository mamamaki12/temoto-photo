name: Deploy to GitHub Pages
# main に入ったとき（または手動実行）に、テストを通ってから GitHub Pages に公開する。
# 事前に リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく必要がある。
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security
      - run: npm run unit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: 公開するファイルだけを集める
        run: sh scripts/make-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
